[package]
name = "steel-core"
version = "0.17.0+mc26.3"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Alve Jeansson"]
build = "build/build.rs"

[features]
#default = ["stand-alone"]
stand-alone = []
slow_chunk_gen = []
test-framework = []
benchmark-support = []

[dependencies]
# Internal crates
steel-crypto = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-macros = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-protocol = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-utils = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-worldgen = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }
steel-math = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "fb63e053ea5ecb26dc9faaa3a80e19fb20d7e079" }

# Async runtime
tokio = { version = "1.54.1", features = ["macros", "sync", "io-util", "rt", "time", "net", "rt-multi-thread", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures = "0.3.34"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
toml = "1.1.8"
wincode = { version = "0.6.3", features = ["derive"] }

# Error handling
thiserror = "2.0.21"

# Concurrency
arc-swap = "1.9.3"
crossbeam = "0.8.5"
parking_lot = { version = "0.13.0", features = ["nightly", "arc_lock"] }
rayon = "1.12.0"
scc = "3.8.8"

# Data structures
bitflags = "2.13.2"
glam = { version = "0.34.1", features = ["serde"] }
rustc-hash = "2.1.3"
smallvec = "1.15.2"
small-map = "0.1.5"
chrono = "0.4.45"

# UUID
uuid = { version = "1.29.0", features = ["serde", "v4"] }

# Networking
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }

# Logging
log = "0.4.34"

# Cryptography
rsa = { version = "0.10.0-rc.19", features = ["sha1", "sha2"] }
rand = "0.10.3"
sha2 = "0.11.1"
md5 = "0.8.1"

# Compression
zstd = "0.14.3"
flate2 = "1.1.10"

# Utilities
enum_dispatch = "0.3.13"
text_components = { git = "https://github.com/Steel-Foundation/TextComponents.git", rev = "04d60d0d9c65ab1cb05154105e184d5904e8990b", features = ["custom", "nbt", "serde"] }
simdnbt = "0.10.0"
tracing = "0.1.44"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proc-macro2 = "1.0.107"
quote = "1.0.47"
heck = "0.5.0"
syn = { version = "3.0.9", features = ["full"] }
glob = "0.3.4"

